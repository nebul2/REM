version: '3.8'

# Stats Docker Compose Configuration with NAS Storage
# All data volumes are stored on NAS to avoid SD card wear on Pi400/WRX

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: stats-timescaledb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gos_rem}
      POSTGRES_USER: ${POSTGRES_USER:-gos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      # Store database on NAS instead of local SD card
      - ${NAS_DATA_PATH:-/home/pi/nas/gos_stats}/timescaledb:/var/lib/postgresql/data
      - ./scripts/init-timescaledb.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    restart: always
    networks:
      - stats-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gos} -d ${POSTGRES_DB:-gos_rem}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  collector:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: stats-collector
    environment:
      # TP-Link API credentials
      - TPLINK_CLIENT_ID=${TPLINK_CLIENT_ID:-fdcae128-0adf-4233-8a58-30760652bd16}
      - TPLINK_CLIENT_SECRET=${TPLINK_CLIENT_SECRET}
      - TPLINK_API_KEY=${TPLINK_API_KEY:-e71bf02f-8b71-42ee-8af0-62a7bdf6c866}
      - TPLINK_REFRESH_TOKEN=${TPLINK_REFRESH_TOKEN}
      # PostgreSQL/TimescaleDB connection
      - POSTGRES_HOST=timescaledb
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-gos_rem}
      - POSTGRES_USER=${POSTGRES_USER:-gos}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change-me-in-production}
      # Collector settings
      - POLL_INTERVAL=${POLL_INTERVAL:-30}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CONF_FILE=/app/config/config.yaml
      - TOKEN_FILE=/app/data/refresh_token.txt
      - COLLECTOR_CONTROL_FILE=/app/data/admin/collector_control.json
    volumes:
      - ./app/config:/app/config:ro
      # Store collector data on NAS
      - ${NAS_DATA_PATH:-/home/pi/nas/gos_stats}/collector:/app/data
      # Admin UI writes collector_control.json under admin dir — mount read-only for poll settings
      - ${NAS_DATA_PATH:-/home/pi/nas/gos_stats}/admin:/app/data/admin:ro
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: always
    networks:
      - stats-network
    healthcheck:
      test: ["CMD", "python", "-c", "import os; pids = [pid for pid in os.listdir('/proc') if pid.isdigit()]; cmdlines = [open(f'/proc/{pid}/cmdline', 'rb').read().decode('utf-8', errors='ignore').replace(chr(0), ' ') for pid in pids if os.path.exists(f'/proc/{pid}/cmdline')]; exit(0 if any('collector.py' in cmd for cmd in cmdlines) else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: stats-admin
    environment:
      # PostgreSQL/TimescaleDB connection
      - POSTGRES_HOST=timescaledb
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-gos_rem}
      - POSTGRES_USER=${POSTGRES_USER:-gos}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change-me-in-production}
      - DATA_DIR=/app/data
    volumes:
      # Store admin data on NAS (snapshots, experiments, groups, etc.)
      - ${NAS_DATA_PATH:-/home/pi/nas/gos_stats}/admin:/app/data
    ports:
      - "${ADMIN_PORT:-7001}:7001"
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: always
    networks:
      - stats-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7001/api/devices').read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

# No named volumes - all data stored on NAS via bind mounts
networks:
  stats-network:
    driver: bridge
