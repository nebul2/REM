version: '3.8'

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: stats-timescaledb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gos_rem}
      POSTGRES_USER: ${POSTGRES_USER:-gos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      - ./scripts/init-timescaledb.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped
    networks:
      - stats-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gos} -d ${POSTGRES_DB:-gos_rem}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  collector:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: stats-collector
    environment:
      # TP-Link API credentials
      - TPLINK_CLIENT_ID=${TPLINK_CLIENT_ID:-fdcae128-0adf-4233-8a58-30760652bd16}
      - TPLINK_CLIENT_SECRET=${TPLINK_CLIENT_SECRET}
      - TPLINK_API_KEY=${TPLINK_API_KEY:-e71bf02f-8b71-42ee-8af0-62a7bdf6c866}
      - TPLINK_REFRESH_TOKEN=${TPLINK_REFRESH_TOKEN}
      # PostgreSQL/TimescaleDB connection
      - POSTGRES_HOST=timescaledb
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-gos_rem}
      - POSTGRES_USER=${POSTGRES_USER:-gos}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change-me-in-production}
      # Collector settings
      - POLL_INTERVAL=${POLL_INTERVAL:-30}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CONF_FILE=/app/config/config.yaml
      - TOKEN_FILE=/app/data/refresh_token.txt
    volumes:
      - ./app/config:/app/config:ro
      - collector-data:/app/data
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - stats-network
    healthcheck:
      test: ["CMD", "pgrep", "-f", "collector.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  grafana:
    image: grafana/grafana:10.4.2
    container_name: stats-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-change-me-in-production}
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:7003}
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./admin/data:/app/data:ro
    ports:
      - "${GRAFANA_PORT:-7003}:3000"
    depends_on:
      timescaledb:
        condition: service_healthy
      admin:
        condition: service_started
    restart: unless-stopped
    networks:
      - stats-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: stats-admin
    environment:
      # PostgreSQL/TimescaleDB connection
      - POSTGRES_HOST=timescaledb
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-gos_rem}
      - POSTGRES_USER=${POSTGRES_USER:-gos}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change-me-in-production}
      - DATA_DIR=/app/data
    volumes:
      - admin-data:/app/data
    ports:
      - "${ADMIN_PORT:-7001}:7001"
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - stats-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7001/api/devices"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  collector-data:
    driver: local
  timescaledb-data:
    driver: local
  grafana-data:
    driver: local
  admin-data:
    driver: local

networks:
  stats-network:
    driver: bridge
