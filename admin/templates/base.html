<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GOS REM - Data Exploration{% endblock %}</title>
    <link rel="stylesheet" href="/static/exploration.css">
    <link rel="icon" href="/static/gos-logo.png" type="image/png">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <!-- Common Header -->
    <header class="gos-header">
        <div class="header-content">
            <div class="logo-section">
                <div class="gos-logo">
                    <img src="/static/gos-logo.png" alt="GoS Logo" style="height: 50px; width: auto;">
                </div>
                <div class="header-text">
                    <h1>GOS Remote Energy Measurement</h1>
                    <p>{% block page_subtitle %}Data Exploration & Analysis{% endblock %}</p>
                </div>
            </div>
            <nav class="header-nav">
                <a href="/" class="nav-link {% block nav_exploration_active %}{% endblock %}">Exploration</a>
                <a href="/manage" class="nav-link {% block nav_manage_active %}{% endblock %}">Manage Groups</a>
                <a href="/gallery" class="nav-link {% block nav_gallery_active %}{% endblock %}">Gallery</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
