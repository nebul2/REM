poller:
  # Run in persistent mode (infinite loop)
  persist: true
  # Interval in seconds between polls (can be overridden by POLL_INTERVAL env var)
  interval: 30

# InfluxDB configuration
# Values can be overridden by environment variables:
# - INFLUXDB_URL
# - INFLUXDB_ORG
# - INFLUXDB_BUCKET
# - INFLUXDB_TOKEN
influxdb:
  - name: "local"
    url: "http://influxdb:8086"
    org: "GOS"
    bucket: "rem"
    # Token should come from environment variable INFLUXDB_TOKEN

