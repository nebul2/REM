poller:
  # Run in persistent mode (infinite loop)
  persist: true
  # Interval in seconds between polls (can be overridden by POLL_INTERVAL env var)
  interval: 30

# PostgreSQL/TimescaleDB configuration
# Values can be overridden by environment variables:
# - POSTGRES_HOST
# - POSTGRES_PORT
# - POSTGRES_DB
# - POSTGRES_USER
# - POSTGRES_PASSWORD
postgresql:
  host: "timescaledb"
  port: 5432
  database: "gos_rem"
  user: "gos"
  # Password should come from environment variable POSTGRES_PASSWORD
